# DEMO mode — preloaded sample data, one-click demo logins, guided tour, admin "Reset demo" button.
#   docker compose -f docker-compose.demo.yml up -d --build
#   -> http://localhost:8091
# Runs as its own project with its own database, so it can run next to live mode.
name: orbit-demo

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - demo-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_MODE: demo
      PORT: 4000
      MONGO_URL: mongodb://mongo:27017/pmapp_demo
      JWT_SECRET: demo-only-secret-not-for-production
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin123
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${DEMO_PORT:-8091}:80"
    depends_on:
      - backend

volumes:
  demo-mongo-data:
