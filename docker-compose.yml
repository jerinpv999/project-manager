# LIVE mode — clean install for real use.
#   cp .env.example .env   # set JWT_SECRET and ADMIN_PASSWORD
#   docker compose up -d --build
#   -> http://localhost:8090
name: orbit-live

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_MODE: live
      PORT: 4000
      MONGO_URL: mongodb://mongo:27017/pmapp
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env (see .env.example)}
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8091}:80"
    depends_on:
      - backend

volumes:
  mongo-data:
